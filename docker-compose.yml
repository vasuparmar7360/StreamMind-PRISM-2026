version: '3.8'

services:
  streammind-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-streammind}
    ports:
      - "5432:5432"
    volumes:
      - streammind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  streammind-backend:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@streammind-db:5432/${POSTGRES_DB:-streammind}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - CHAT_MODEL=${CHAT_MODEL:-qwen2.5:3b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      streammind-db:
        condition: service_healthy
    # Assuming Ollama is running on the host machine since it requires GPU
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  streammind_pgdata:
